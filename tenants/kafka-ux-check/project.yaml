apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: tenant-kafka-ux-check-admission
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  description: Parent Domain attachment for kafka-ux-check.
  sourceRepos:
    - https://github.com/contract-first-kafka/developer-charts.git
    - https://github.com/contract-first-kafka/kafka-ux-check-domain.git
    - https://github.com/contract-first-kafka/platform-components.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: openshift-gitops
    - server: https://kubernetes.default.svc
      namespace: cf-idp-keycloak
    - server: https://kubernetes.default.svc
      namespace: cf-idp-secrets
    - server: https://kubernetes.default.svc
      namespace: kafka-ux-check-catalog
  clusterResourceWhitelist:
    - {group: "", kind: Namespace}
    - {group: rbac.authorization.k8s.io, kind: ClusterRoleBinding}
    - {group: external-secrets.io, kind: ClusterSecretStore}
  namespaceResourceWhitelist:
    - {group: image.openshift.io, kind: ImageStream}
    - {group: "", kind: ConfigMap}
    - {group: "", kind: Service}
    - {group: apps, kind: Deployment}
    - {group: batch, kind: Job}
    - {group: route.openshift.io, kind: Route}
    - {group: tekton.dev, kind: Pipeline}
    - {group: triggers.tekton.dev, kind: EventListener}
    - {group: triggers.tekton.dev, kind: TriggerTemplate}
    - {group: "", kind: ServiceAccount}
    - {group: argoproj.io, kind: AppProject}
    - {group: argoproj.io, kind: ApplicationSet}
    - {group: external-secrets.io, kind: ExternalSecret}
    - {group: generators.external-secrets.io, kind: Password}
    - {group: k8s.keycloak.org, kind: KeycloakOIDCClient}
    - {group: rbac.authorization.k8s.io, kind: Role}
    - {group: rbac.authorization.k8s.io, kind: RoleBinding}
