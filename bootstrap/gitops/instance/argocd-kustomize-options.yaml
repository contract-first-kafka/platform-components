apiVersion: argoproj.io/v1beta1
kind: ArgoCD
metadata:
  name: openshift-gitops
  namespace: openshift-gitops
spec:
  # The populated platform cache exhausted the operator default 2Gi limit.
  controller:
    resources:
      limits:
        memory: 4Gi
  rbac:
    policy: |
      g, gitops-admins, role:admin
    scopes: '[groups]'
  applicationSet:
    extraCommandArgs:
      - --enable-policy-override
  resourceIgnoreDifferences:
    resourceIdentifiers:
      - group: ""
        kind: ServiceAccount
        customization:
          jsonPointers:
            - /imagePullSecrets
